<svg viewBox="-150 -150 300 300" width="300" height="300" xmlns="http://w3.org">
    <defs>
        <linearGradient id="top-grad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#e0e0e0"/>
            <stop offset="100%" stop-color="#ffffff"/>
        </linearGradient>
        <linearGradient id="left-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#b8b8b8"/>
            <stop offset="100%" stop-color="#7a7a7a"/>
        </linearGradient>
        <linearGradient id="right-grad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#949494"/>
            <stop offset="100%" stop-color="#ededed"/>
        </linearGradient>

        <!-- Суперэллипс n=5: углы стали более квадратными -->
        <path id="superellipse" d="M 0,-100 C 51.5,-100 100,-51.5 100,0 C 100,51.5 51.5,100 0,100 C -51.5,100 -100,51.5 -100,0 C -100,-51.5 -51.5,-100 0,-100 Z" />
    </defs>

    <!-- Верхняя грань -->
    <use href="#superellipse" fill="url(#top-grad)" transform="rotate(-30) skewX(30) scale(1, 0.5774) translate(0, -57.7)" />

    <!-- Левая грань -->
    <use href="#superellipse" fill="url(#left-grad)" transform="rotate(90) skewX(30) scale(1, 0.5774) translate(0, 57.7)" />

    <!-- Правая грань -->
    <use href="#superellipse" fill="url(#right-grad)" transform="rotate(-150) skewX(30) scale(1, 0.5774) translate(0, 57.7)" />
</svg>
